# teslausb-lite settings, read as a bash file

# upload only on this wifi network; empty means any network with internet
HOME_SSID=""
WIFI_IFACE=wlan0

# rclone remote and folder for the clips
ARCHIVE_REMOTE="onedrive:TeslaCam"

# optional rclone folder with content for the extra drives:
# LightShow/, Wraps/, LicensePlate/, Boombox/, Music/ and LockChime.wav
CONTENT_REMOTE=""

# drive sizes, 0 means no such drive; to resize, stop the service and delete
# the image in /var/lib/teslausb-lite (its content is lost)
CAM_SIZE=64G
LIGHTSHOW_SIZE=2G
BOOMBOX_SIZE=256M
MUSIC_SIZE=0

# the drive whose root gets LockChime.wav: lightshow, boombox or music
LOCKCHIME_DRIVE=lightshow

ARCHIVE_TRACKMODE=no

# seconds between reaching the home network and the first upload; raise it
# if you want time to delete clips in the car before they go up
ARRIVAL_DELAY=15

# seconds between looks at the drive while home
RESCAN_INTERVAL=900

# at boot, delete the oldest uploaded clips when less than this is free;
# CAM_SIZE or more deletes every uploaded clip
MIN_FREE=20G

# keep the car awake over bluetooth until everything is uploaded
KEEP_AWAKE=no
TESLA_VIN=""
# keep-accessory-power or sentry-mode; either is switched off afterwards
KEEP_AWAKE_COMMAND=keep-accessory-power
KEEP_AWAKE_MAX=7200

# optional Pushover keys, named as in teslausb's config; a message when an
# upload starts and ends, and when an extra drive gets new content
PUSHOVER_USER_KEY=""
PUSHOVER_APP_KEY=""

#RCLONE_FLAGS=(--transfers 2 --retries 3 --low-level-retries 10)
